[package]
name = "postmoth-daemon"
description = "Postmoth background mail and OTP daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "postmoth-daemon"
path = "src/main.rs"

[lib]
name = "postmoth_daemon"
path = "src/lib.rs"

[dependencies]
postmoth-core.workspace = true
postmoth-ipc = { workspace = true, features = ["tokio"] }
postmoth-mail.workspace = true
postmoth-mime.workspace = true
postmoth-otp.workspace = true
postmoth-platform.workspace = true
postmoth-store.workspace = true
clap.workspace = true
rustix.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
log.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true

[dev-dependencies]
postmoth-mail = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
